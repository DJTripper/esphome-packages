esphome:
  comment: "Shelly Dimmer 2"

esp8266:
  board: esp8285

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 115200

light:
  # Dimmer.
  - platform: shelly_dimmer
    name: Licht
    id: thislight
    power:
      name: Leistung
      id: power
    voltage:
      name: Spannung
      disabled_by_default: True
    current:
      name: Stromstaerke
      disabled_by_default: True
    min_brightness: ${min_brightness}
    max_brightness: ${max_brightness}
    firmware:
      version: "51.6"
    restore_mode: RESTORE_DEFAULT_OFF
    #  - platform: binary
    #    name: "${friendly_name} RESET SHD"
    #    output: SHDReset

sensor:
  - platform: ntc
    sensor: temp_resistance_reading
    name: Temperatur
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    # Overheat protection (stock firmware also shuts off)
    on_value:
      - if:
          condition:
            and:
              - lambda: 'return x > 90;'
              - light.is_on: thislight
          then:
            - logger.log:
                level: WARN
                format: "Overheat (%.1f °C), switching light off"
                args: [x]
            - light.turn_off: thislight
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 32kOhm
    disabled_by_default: True
  - platform: adc
    id: temp_analog_reading
    pin: A0
    disabled_by_default: True

  # Total daily energy sensor
  - platform: total_daily_energy
    name: Tagesleistung
    power_id: power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh


binary_sensor:
  - platform: gpio
    id: wall_switch
    pin:
      number: GPIO14
    name: Switch
    disabled_by_default: True
    filters:
      - delayed_on_off: 100ms
    # Short press toggles, long press dims (direction alternates)
    on_press:
      then:
        - lambda: 'id(long_pressed) = false;'
        - script.execute: long_press_dim
    on_release:
      then:
        - script.stop: long_press_dim
        - if:
            condition:
              lambda: 'return id(long_pressed);'
            then:
              - lambda: 'id(dim_up) = !id(dim_up);'
            else:
              - light.toggle: thislight

globals:
  - id: dim_up
    type: bool
    initial_value: 'true'
  - id: long_pressed
    type: bool
    initial_value: 'false'

script:
  - id: long_press_dim
    mode: restart
    then:
      - delay: 500ms
      - lambda: 'id(long_pressed) = true;'
      - if:
          condition:
            light.is_off: thislight
          then:
            # Start dimmed and ramp up
            - lambda: 'id(dim_up) = true;'
            - light.turn_on:
                id: thislight
                brightness: 1%
          else:
            # Reverse at the ends
            - lambda: |-
                float b = id(thislight).remote_values.get_brightness();
                if (b >= 0.99f) id(dim_up) = false;
                else if (b <= 0.02f) id(dim_up) = true;
      - while:
          condition:
            binary_sensor.is_on: wall_switch
          then:
            - light.dim_relative:
                id: thislight
                relative_brightness: !lambda 'return id(dim_up) ? 0.05f : -0.05f;'
                transition_length: 100ms
                brightness_limits:
                  min_brightness: 1%
            - delay: 100ms
